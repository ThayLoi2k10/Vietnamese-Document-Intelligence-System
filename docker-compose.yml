# ==============================================================================
# Docker Compose — Vietnamese Legal Document Intelligence & RAG System
# Chạy chỉ với 1 lệnh: docker compose up --build
# Giao diện Web: http://localhost:8501
# ==============================================================================

services:
  legal_rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: vietnamese-legal-rag:latest
    container_name: vietnamese_legal_rag
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount ./data để dùng ngay embeddings.f32.npy / index.faiss sẵn có trên máy
      # hoặc lưu chỉ mục tải tự động ở lần chạy đầu tiên
      - ./data:/app/data
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      # Lưu cache mô hình BGE-M3 & BGE-Reranker cố định giữa các lần khởi động container
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  huggingface_cache:
