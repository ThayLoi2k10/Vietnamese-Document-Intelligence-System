# ==============================================================================
# Docker Compose for Vietnamese Legal RAG System
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: REST API Backend (FastAPI - Phase 17)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vietnamese-legal-rag:latest
    container_name: legal_rag_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # Mount data and indices dynamically from host to avoid giant images
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      # Mount host Hugging Face cache so models never need to download again
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface:ro
    environment:
      - PYTHONUNBUFFERED=1
      - COLAB_URL=${COLAB_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------------------------
  # Service 2: Interactive Web Application (Streamlit - Phase 18)
  # ----------------------------------------------------------------------------
  ui:
    image: vietnamese-legal-rag:latest
    container_name: legal_rag_ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./app.py:/app/app.py
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface:ro
    environment:
      - PYTHONUNBUFFERED=1
      - API_BACKEND_URL=http://api:8000
      - COLAB_URL=${COLAB_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
